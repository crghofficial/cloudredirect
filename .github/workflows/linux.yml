name: Linux

on:
  push:
    branches: [master, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native ${{ matrix.bits }}-bit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bits: [64, 32]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install dependencies
        run: |
          if [ '${{ matrix.bits }}' = 32 ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y ninja-build g++-multilib libcurl4-openssl-dev:i386
          else
            sudo apt-get update
            sudo apt-get install -y ninja-build libcurl4-openssl-dev qt6-base-dev qt6-declarative-dev
          fi
      - name: Configure
        run: |
          if [ '${{ matrix.bits }}' = 32 ]; then
            cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 \
              -DCURL_LIBRARY=/usr/lib/i386-linux-gnu/libcurl.so \
              -DCURL_INCLUDE_DIR=/usr/include/i386-linux-gnu
          else
            cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build and test
        run: |
          cmake --build build-ci --parallel 2
          ctest --test-dir build-ci --output-on-failure
          python3 - <<'PYCLI'
          import json
          import os
          import subprocess
          import tempfile

          with tempfile.TemporaryDirectory() as config:
              result = subprocess.run(
                  ['build-ci/cloud_redirect_cli', 'auth-status', 'gdrive'],
                  env={**os.environ, 'XDG_CONFIG_HOME': config},
                  text=True, capture_output=True)
              if result.returncode != 1 or json.loads(result.stdout).get('authenticated') is not False:
                  raise SystemExit(f'Unexpected CLI result: {result.returncode} {result.stderr}')
          PYCLI
      - name: Build Qt UI
        if: matrix.bits == 64
        run: |
          cmake -S ui-linux -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ui --parallel 2

  steam-runtime:
    name: Steam Runtime ABI and Flatpak inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build make binutils perl
      - name: Build and validate
        run: |
          scripts/build-linux64.sh
          scripts/stage-flatpak.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cloudredirect-linux-x86_64
          path: |
            flatpak/cloud_redirect.so
            flatpak/cloud_redirect_cli
          if-no-files-found: error
